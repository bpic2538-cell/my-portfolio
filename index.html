    <script>
        let audioCtx = null;
        let rotateSoundInterval = 0;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;

                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'hologram') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(1760, now + 0.4);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(440, now);
                    osc2.frequency.exponentialRampToValueAtTime(880, now + 0.4);
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    gain2.gain.setValueAtTime(0.15, now);
                    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc2.start(now);
                    osc2.stop(now + 0.4);

                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'zoom') {
                    const dur = 0.55;
                    const bufferSize = audioCtx.sampleRate * dur;
                    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }

                    const whiteNoise = audioCtx.createBufferSource();
                    whiteNoise.buffer = noiseBuffer;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.Q.value = 3.5;
                    filter.frequency.setValueAtTime(150, now);
                    filter.frequency.exponentialRampToValueAtTime(3200, now + dur * 0.5);
                    filter.frequency.exponentialRampToValueAtTime(400, now + dur);

                    const noiseGain = audioCtx.createGain();
                    noiseGain.gain.setValueAtTime(0.01, now);
                    noiseGain.gain.linearRampToValueAtTime(0.4, now + dur * 0.4);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + dur);

                    whiteNoise.connect(filter);
                    filter.connect(noiseGain);
                    noiseGain.connect(audioCtx.destination);
                    whiteNoise.start(now);
                    whiteNoise.stop(now + dur);

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(80, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + dur * 0.45);
                    osc.frequency.exponentialRampToValueAtTime(200, now + dur);

                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0.3, now + dur * 0.4);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
                    osc.start(now);
                    osc.stop(now + dur);
                    return;
                } else if (type === 'rotate') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.linearRampToValueAtTime(480, now + 0.15);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch (e) {
                console.log('Audio note:', e);
            }
        }

        let scene, camera, renderer, raycaster, mouse;
        let exhibits = [];
        let interactiveObjects = [];
        let slideShowObjects = [];
        let activeHologram = null;
        let prevTime = performance.now();

        let cameraYaw = 0;
        let cameraPitch = 0;

        let isAnimatingCamera = false;
        let isZoomedToBooth = false;
        let cameraTargetPosition = new THREE.Vector3();
        let cameraTargetYaw = 0;
        let cameraTargetPitch = 0;
        let cameraStartPos = new THREE.Vector3();
        let cameraStartYaw = 0;
        let cameraStartPitch = 0;
        let animationProgress = 0;
        let animationDuration = 0.8;

        let defaultExhibits = [
            {
                title: "บูธที่ 1: รายงานผลการปฏิบัติงาน ประจำปี 2569",
                category: "ข้อมูลผู้รายงาน",
                description: "ชื่อ: นายสรัญมนตรี ต้นกันยา\nตำแหน่ง: ครูพิเศษสอน สาขาวิชาอิเล็กทรอนิกส์\nวิทยาลัยการอาชีพบ้านไผ่ สำนักงานคณะกรรมการการอาชีวศึกษา\n\nหน้าที่ที่ได้รับมอบหมาย:\n• ผู้ช่วยหัวหน้างานพัสดุ (กล้องวงจรปิดและเครื่องเสียง)\n• ผู้ช่วยหัวหน้างานมาตรฐานและประกันคุณภาพการศึกษา\n• ผู้ช่วยหัวหน้างานพัฒนาหลักสูตรสายเทคโนโลยีหรือสายปฏิบัติการ\n• สอนประจำสาขาวิชาอิเล็กทรอนิกส์/เทคโนโลยีอิเล็กทรอนิกส์",
                images: [],
                aspectRatio: 16 / 9,
                position: { x: 0, y: 5.2, z: -10 },
                rotation: { x: 0, y: 0, z: 0 },
                size: { width: 5.5, height: 3.1 }
            },
            {
                title: "บูธที่ 2: การจัดการเรียนรู้และนวัตกรรม",
                category: "การจัดการเรียนรู้",
                description: "รายวิชาที่สอน: งานนิวเมติกและไฮดรอลิกส์เบื้องต้น, อุปกรณ์อิเล็กทรอนิกส์และวงจร, มัลติมีเดีย, การออกแบบวงจรอิเล็กทรอนิกส์ด้วยคอมพิวเตอร์, โปรแกรมเมเบิลลอจิกคอนโทรล (PLC)\n\nผลงานนวัตกรรม & วิจัยในชั้นเรียน:\n• ชุดฝึกจำลองควบคุมหุ่นยนต์และระบบควบคุมในโรงงาน\n• การจัดสอบวัดผลรายวิชามัลติมีเดีย: ให้นักเรียนจัดแข่งขันหุ่นยนต์เดินตามเส้นพร้อมถ่ายทอดสด (Real-time Live Streaming, Switcher กล้อง, เสียง, กราฟิก Scoreboard) บูรณาการประเมินตามสภาพจริง\n• วิจัยในชั้นเรียน: เรื่องการพัฒนาความรับผิดชอบและการแก้ไขปัญหาเฉพาะหน้า (Troubleshooting) ของนักเรียน ปวช.2 สาชาช่างอิเล็กทรอนิกส์ จำนวน 7 คน ผลปรากฏว่ามีความรับผิดชอบและทักษะแก้ปัญหาเฉพาะหน้าทางเทคนิคสูงขึ้นอย่างมีนัยสำคัญ\n• แผนธุรกิจ 'BPIC Green 3D model': นำเส้นใยพลาสติกรีไซเคิลเป็นผลิตภัณฑ์ 3 มิติ พร้อมเปิดให้บริการ 2/2569",
                images: [],
                aspectRatio: 16 / 9,
                position: { x: -10, y: 5.2, z: 0 },
                rotation: { x: 0, y: Math.PI / 2, z: 0 },
                size: { width: 5.5, height: 3.1 }
            },
            {
                title: "บูธที่ 3: การพัฒนาตนเองและวิชาชีพ",
                category: "การพัฒนาวิชาชีพ",
                description: "ภารกิจสนับสนุนสถานศึกษา & การอบรมพัฒนาตนเอง พ.ศ. 2569:\n• จัดเวรควบคุมระบบภาพและเสียงหน้าเสาธงและกิจกรรมภายในวิทยาลัย\n• เข้าร่วมอบรมจัดทำแผนพัฒนาสถานศึกษาระยะ 5 ปี (68-72) เมื่อ 7-8 พ.ค. 2569\n• ผ่านอบรมเสริมสร้างคุณธรรมจริยธรรมและธรรมาภิบาล (ต้านทุจริต) 13 มิ.ย. 2569 ณ วิทยาลัยการอาชีพบ้านไผ่\n• ผ่านอบรมเชื่อมโยงเครือข่าย M-OVEC เมื่อ 23 ก.ย. 2569\n• เข้าร่วมประเมินศูนย์บ่มเพาะผู้ประกอบการอาชีวศึกษาระดับภาคตะวันออกเฉียงเหนือ ปี 2569 (รอบปีการศึกษา 2568)\n• ผ่านอบรมโครงการพัฒนาครูเพื่อเป็นผู้ประกอบการศูนย์บ่มเพาะฯ 14-15 ก.ย. 2569 ณ โรงแรมนภาลัย จ.อุดรธานี",
                images: [],
                aspectRatio: 16 / 9,
                position: { x: 10, y: 5.2, z: 0 },
                rotation: { x: 0, y: -Math.PI / 2, z: 0 },
                size: { width: 5.5, height: 3.1 }
            }
        ];

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e17);
            scene.fog = new THREE.FogExp2(0x0a0e17, 0.015);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 2.5, 6);
            cameraYaw = 0;
            cameraPitch = 0;
            updateCameraOrientation();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.7);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 0.9);
            mainLight.position.set(0, 18, 5);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            scene.add(mainLight);

            buildExhibitionRoom();

            exhibits = [...defaultExhibits];
            renderExhibitsInScene();
            renderExhibitsList();

            window.addEventListener('resize', onWindowResize);
            container.addEventListener('click', onPointerClick);
            container.addEventListener('touchend', onPointerClick);
            setupTouchAndWheelControls();

            animate();
        }

        function updateCameraOrientation() {
            cameraPitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, cameraPitch));
            const euler = new THREE.Euler(cameraPitch, cameraYaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        }

        function buildExhibitionRoom() {
            const roomSize = 30;
            const roomHeight = 11;

            const floorGeo = new THREE.PlaneGeometry(roomSize, roomSize);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.3, metalness: 0.2 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const ceilingGeo = new THREE.PlaneGeometry(roomSize, roomSize);
            const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.9 });
            const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
            ceiling.position.y = roomHeight;
            ceiling.rotation.x = Math.PI / 2;
            scene.add(ceiling);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const halfSize = roomSize / 2;

            const backWall = new THREE.Mesh(new THREE.BoxGeometry(roomSize, roomHeight, 0.5), wallMat);
            backWall.position.set(0, roomHeight / 2, -halfSize);
            scene.add(backWall);

            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(roomSize, roomHeight, 0.5), wallMat);
            frontWall.position.set(0, roomHeight / 2, halfSize);
            scene.add(frontWall);

            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, roomHeight, roomSize), wallMat);
            leftWall.position.set(-halfSize, roomHeight / 2, 0);
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, roomHeight, roomSize), wallMat);
            rightWall.position.set(halfSize, roomHeight / 2, 0);
            scene.add(rightWall);
        }

        function createHologramTexture(ex) {
            const canvas2d = document.createElement('canvas');
            canvas2d.width = 1600;
            canvas2d.height = 950;
            const ctx = canvas2d.getContext('2d');
            
            ctx.fillStyle = 'rgba(11, 15, 25, 0.98)';
            ctx.fillRect(0, 0, canvas2d.width, canvas2d.height);

            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 12;
            ctx.strokeRect(15, 15, canvas2d.width - 30, canvas2d.height - 30);

            ctx.fillStyle = 'rgba(56, 189, 248, 0.22)';
            ctx.fillRect(40, 40, canvas2d.width - 80, 110);

            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 38px "Sarabun", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("✨ " + ex.category.toUpperCase() + " ✨", canvas2d.width / 2, 95);

            ctx.font = 'bold 42px "Sarabun", sans-serif';
            ctx.fillStyle = '#ffffff';
            wrapText(ctx, ex.title, canvas2d.width / 2, 210, 1480, 52);

            ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(80, 270);
            ctx.lineTo(canvas2d.width - 80, 270);
            ctx.stroke();

            ctx.font = '28px "Sarabun", sans-serif';
            ctx.fillStyle = '#e2e8f0';
            wrapText(ctx, ex.description, canvas2d.width / 2, 335, 1480, 44);

            const texture = new THREE.CanvasTexture(canvas2d);
            texture.needsUpdate = true;
            return texture;
        }

        function createDefaultWallPlaceholder(ex) {
            const canvas2d = document.createElement('canvas');
            canvas2d.width = 1024;
            canvas2d.height = Math.round(1024 / ex.aspectRatio);
            const ctx = canvas2d.getContext('2d');
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas2d.width, canvas2d.height);
            
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(60, 60, canvas2d.width - 120, canvas2d.height - 120);

            ctx.fillStyle = '#64748b';
            ctx.font = 'bold 40px "Sarabun", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("🖼️ คลิกเพื่อดูรายงานผลการปฏิบัติงาน", canvas2d.width / 2, canvas2d.height / 2);

            const texture = new THREE.CanvasTexture(canvas2d);
            return texture;
        }

        function renderExhibitsInScene() {
            interactiveObjects.forEach(obj => scene.remove(obj));
            interactiveObjects = [];
            slideShowObjects = [];

            exhibits.forEach((ex) => {
                const group = new THREE.Group();
                group.position.set(ex.position.x, ex.position.y, ex.position.z);
                group.rotation.set(ex.rotation.x, ex.rotation.y, ex.rotation.z);

                const width = ex.size.width;
                const height = ex.size.height;

                const frameGeo = new THREE.BoxGeometry(width + 0.4, height + 0.4, 0.12);
                const frameMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.2 });
                const frame = new THREE.Mesh(frameGeo, frameMat);
                frame.castShadow = true;
                group.add(frame);

                const canvasGeo = new THREE.PlaneGeometry(width, height);
                let imagePlane;
                let texturesList = [];

                if (ex.images && ex.images.length > 0) {
                    const textureLoader = new THREE.TextureLoader();
                    ex.images.forEach(imgUrl => {
                        const tex = textureLoader.load(imgUrl);
                        texturesList.push(tex);
                    });

                    const canvasMat = new THREE.MeshBasicMaterial({ map: texturesList[0] });
                    imagePlane = new THREE.Mesh(canvasGeo, canvasMat);

                    if (texturesList.length > 1) {
                        slideShowObjects.push({
                            mesh: imagePlane,
                            textures: texturesList,
                            currentIndex: 0,
                            timer: 0,
                            interval: 4.0
                        });
                    }
                } else {
                    const defaultTex = createDefaultWallPlaceholder(ex);
                    const canvasMat = new THREE.MeshBasicMaterial({ map: defaultTex });
                    imagePlane = new THREE.Mesh(canvasGeo, canvasMat);
                }

                imagePlane.position.z = 0.07;
                group.add(imagePlane);

                const holoTex = createHologramTexture(ex);
                const holoGeo = new THREE.PlaneGeometry(8.2, 4.4); 
                const holoMat = new THREE.MeshBasicMaterial({ 
                    map: holoTex, 
                    transparent: true, 
                    opacity: 0.98,
                    side: THREE.DoubleSide 
                });
                const holoMesh = new THREE.Mesh(holoGeo, holoMat);
                
                // Positioned lower and further out so it absolutely never overlaps or blocks the exhibit image above
                holoMesh.position.set(0, -3.8, 0.9);
                holoMesh.rotation.x = -0.15; // Slightly tilted upward for perfect viewing angle
                holoMesh.visible = false;
                group.add(holoMesh);

                imagePlane.userData = { 
                    isWallImage: true, 
                    hologram: holoMesh, 
                    exhibitData: ex,
                    parentBooth: group 
                };

                group.userData = { exhibitData: ex, hologram: holoMesh };
                scene.add(group);
                interactiveObjects.push(imagePlane);
            });
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const paragraphs = text.split('\n');
            for(let p = 0; p < paragraphs.length; p++) {
                const words = paragraphs[p].split(' ');
                let line = '';
                for(let n = 0; n < words.length; n++) {
                    let testLine = line + words[n] + ' ';
                    let metrics = context.measureText(testLine);
                    let testWidth = metrics.width;
                    if (testWidth > maxWidth && n > 0) {
                        context.fillText(line, x, y);
                        line = words[n] + ' ';
                        y += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                context.fillText(line, x, y);
                y += lineHeight;
            }
        }

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let initialPinchDistance = null;

        function getTouchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function setupTouchAndWheelControls() {
            const container = document.getElementById('canvas-container');

            container.addEventListener('mousedown', (e) => {
                if (isAnimatingCamera) return;
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            container.addEventListener('touchstart', (e) => {
                if (isAnimatingCamera) return;
                if (e.touches.length === 1) {
                    isDragging = true;
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    initialPinchDistance = null;
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    initialPinchDistance = getTouchDistance(e.touches);
                }
            }, { passive: true });

            window.addEventListener('mouseup', () => { isDragging = false; });
            window.addEventListener('touchend', () => { 
                isDragging = false; 
                initialPinchDistance = null;
            });

            container.addEventListener('mousemove', (e) => {
                if (!isDragging || isAnimatingCamera) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                previousMousePosition = { x: e.clientX, y: e.clientY };

                cameraYaw -= deltaX * 0.003;
                cameraPitch -= deltaY * 0.003;
                updateCameraOrientation();
                isZoomedToBooth = false;

                if (Math.abs(deltaX) > 4 || Math.abs(deltaY) > 4) {
                    const nowTime = Date.now();
                    if (nowTime - rotateSoundInterval > 220) {
                        playSound('rotate');
                        rotateSoundInterval = nowTime;
                    }
                }
            });

            container.addEventListener('touchmove', (e) => {
                if (isAnimatingCamera) return;
                if (e.touches.length === 2 && initialPinchDistance !== null) {
                    const currentDistance = getTouchDistance(e.touches);
                    const distanceDelta = currentDistance - initialPinchDistance;
                    initialPinchDistance = currentDistance;
                    
                    camera.translateZ(-distanceDelta * 0.05);
                    camera.position.y = 2.5;
                    isZoomedToBooth = false;
                    playSound('zoom');
                } else if (isDragging && e.touches.length === 1) {
                    const deltaX = e.touches[0].clientX - previousMousePosition.x;
                    const deltaY = e.touches[0].clientY - previousMousePosition.y;
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };

                    cameraYaw -= deltaX * 0.003;
                    cameraPitch -= deltaY * 0.003;
                    updateCameraOrientation();
                    isZoomedToBooth = false;

                    const nowTime = Date.now();
                    if (nowTime - rotateSoundInterval > 220) {
                        playSound('rotate');
                        rotateSoundInterval = nowTime;
                    }
                }
            }, { passive: true });

            container.addEventListener('wheel', (e) => {
                if (isAnimatingCamera) return;
                e.preventDefault();
                camera.translateZ(e.deltaY * 0.01);
                camera.position.y = 2.5;
                camera.position.x = Math.max(-12, Math.min(12, camera.position.x));
                camera.position.z = Math.max(-12, Math.min(12, camera.position.z));
                isZoomedToBooth = false;
                playSound('zoom');
            }, { passive: false });
        }

        function onPointerClick(event) {
            if (isAnimatingCamera) return;

            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();
            
            let clientX = event.clientX;
            let clientY = event.clientY;

            if (event.changedTouches && event.changedTouches.length > 0) {
                clientX = event.changedTouches[0].clientX;
                clientY = event.changedTouches[0].clientY;
            }

            if (!clientX || clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) return;

            mouse.x = ((clientX - rect.left) / container.clientWidth) * 2 - 1;
            mouse.y = -((clientY - rect.top) / container.clientHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(interactiveObjects, false);
            if (intersects.length > 0) {
                const imgObj = intersects[0].object;
                if (imgObj.userData && imgObj.userData.isWallImage) {
                    const targetHologram = imgObj.userData.hologram;
                    
                    interactiveObjects.forEach(obj => {
                        if (obj.userData.hologram && obj.userData.hologram !== targetHologram) {
                            obj.userData.hologram.visible = false;
                        }
                    });

                    targetHologram.visible = !targetHologram.visible;
                    activeHologram = targetHologram.visible ? targetHologram : null;

                    if (targetHologram.visible) {
                        playSound('hologram');
                        showExhibitInfo(imgObj.userData.exhibitData);
                        smoothZoomToBooth(imgObj.userData.parentBooth);
                    } else {
                        playSound('click');
                        closeInfoPanel();
                    }
                    return;
                }
            }
        }

        function smoothZoomToBooth(boothObject) {
            cameraStartPos.copy(camera.position);
            cameraStartYaw = cameraYaw;
            cameraStartPitch = cameraPitch;

            const worldPos = new THREE.Vector3();
            boothObject.getWorldPosition(worldPos);

            const normalDir = new THREE.Vector3(0, 0, 1).applyQuaternion(boothObject.getWorldQuaternion(new THREE.Quaternion()));

            cameraTargetPosition.set(
                worldPos.x + normalDir.x * 4.2,
                2.2,
                worldPos.z + normalDir.z * 4.2
            );

            const lookTarget = new THREE.Vector3(worldPos.x, worldPos.y - 1.2, worldPos.z);
            
            const tempCam = camera.clone();
            tempCam.position.copy(cameraTargetPosition);
            tempCam.lookAt(lookTarget);
            
            const tempEuler = new THREE.Euler().setFromQuaternion(tempCam.quaternion, 'YXZ');
            cameraTargetYaw = tempEuler.y;
            cameraTargetPitch = tempEuler.x;

            animationProgress = 0;
            isAnimatingCamera = true;
            isZoomedToBooth = true;
            playSound('zoom');
        }

        function showExhibitInfo(data) {
            document.getElementById('info-title').innerText = data.title;
            document.getElementById('badge-category').innerText = data.category;
            document.getElementById('info-desc').innerText = data.description;
            
            const imgContainer = document.getElementById('info-image-container');
            if (data.images && data.images.length > 0) {
                imgContainer.innerHTML = `<img src="${data.images[0]}" class="w-full h-full object-cover">`;
            } else {
                imgContainer.innerHTML = `<span class="text-xs text-slate-500">รายงานผลการปฏิบัติงาน พ.ศ. 2569</span>`;
            }

            document.getElementById('info-panel').classList.remove('hidden');
        }

        function closeInfoPanel() {
            document.getElementById('info-panel').classList.add('hidden');
            interactiveObjects.forEach(obj => {
                if (obj.userData.hologram) obj.userData.hologram.visible = false;
            });
            activeHologram = null;
        }

        function resetCamera() {
            if (isAnimatingCamera) return;
            
            cameraStartPos.copy(camera.position);
            cameraStartYaw = cameraYaw;
            cameraStartPitch = cameraPitch;

            cameraTargetPosition.set(0, 2.5, 6);
            cameraTargetYaw = 0;
            cameraTargetPitch = 0;

            animationProgress = 0;
            isAnimatingCamera = true;
            isZoomedToBooth = false;
            closeInfoPanel();
            playSound('zoom');
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            slideShowObjects.forEach(slide => {
                slide.timer += delta;
                if (slide.timer >= slide.interval) {
                    slide.timer = 0;
                    slide.currentIndex = (slide.currentIndex + 1) % slide.textures.length;
                    slide.mesh.material.map = slide.textures[slide.currentIndex];
                    slide.mesh.material.needsUpdate = true;
                }
            });

            if (isAnimatingCamera) {
                animationProgress += delta / animationDuration;
                if (animationProgress >= 1) {
                    animationProgress = 1;
                    isAnimatingCamera = false;
                }

                const easeProgress = 1 - Math.pow(1 - animationProgress, 3);

                camera.position.lerpVectors(cameraStartPos, cameraTargetPosition, easeProgress);
                cameraYaw = cameraStartYaw + (cameraTargetYaw - cameraStartYaw) * easeProgress;
                cameraPitch = cameraStartPitch + (cameraTargetPitch - cameraStartPitch) * easeProgress;
                updateCameraOrientation();
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function toggleModal(show) {
            const modal = document.getElementById('data-modal');
            if (show) {
                modal.classList.remove('hidden');
                renderExhibitsList();
            } else {
                modal.classList.add('hidden');
            }
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const title = document.getElementById('form-title').value;
            const category = "ผลงานเพิ่มเติม";
            const description = document.getElementById('form-desc').value;
            const imageInput = document.getElementById('form-images');

            let imageUrls = [];
            let aspectRatio = 16 / 9;
            let width = 5.5;
            let height = 3.1;

            const positions = [
                { x: 0, y: 5.2, z: -10, rotY: 0 },
                { x: -10, y: 5.2, z: 0, rotY: Math.PI / 2 },
                { x: 10, y: 5.2, z: 0, rotY: -Math.PI / 2 }
            ];
            const posIndex = exhibits.length % positions.length;
            const pos = positions[posIndex];

            if (imageInput.files && imageInput.files.length > 0) {
                for (let i = 0; i < imageInput.files.length; i++) {
                    imageUrls.push(URL.createObjectURL(imageInput.files[i]));
                }

                const firstImg = new Image();
                firstImg.src = imageUrls[0];
                firstImg.onload = function() {
                    if (firstImg.naturalWidth && firstImg.naturalHeight) {
                        aspectRatio = firstImg.naturalWidth / firstImg.naturalHeight;
                        width = 5.5;
                        height = width / aspectRatio;

                        const newExhibit = {
                            title,
                            category,
                            description,
                            images: imageUrls,
                            aspectRatio: aspectRatio,
                            position: { x: pos.x, y: pos.y, z: pos.z },
                            rotation: { x: 0, y: pos.rotY, z: 0 },
                            size: { width: width, height: height }
                        };

                        exhibits.push(newExhibit);
                        renderExhibitsInScene();
                        renderExhibitsList();
                    }
                };
            } else {
                const newExhibit = {
                    title,
                    category,
                    description,
                    images: [],
                    aspectRatio: aspectRatio,
                    position: { x: pos.x, y: pos.y, z: pos.z },
                    rotation: { x: 0, y: pos.rotY, z: 0 },
                    size: { width: width, height: height }
                };

                exhibits.push(newExhibit);
                renderExhibitsInScene();
                renderExhibitsList();
            }

            document.getElementById('exhibit-form').reset();
            toggleModal(false);
        }

        function addImagesToBooth(index, event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            for (let i = 0; i < files.length; i++) {
                const url = URL.createObjectURL(files[i]);
                exhibits[index].images.push(url);
            }

            renderExhibitsInScene();
            renderExhibitsList();
            playSound('click');
        }

        function renderExhibitsList() {
            const listContainer = document.getElementById('exhibits-list');
            listContainer.innerHTML = '';
            exhibits.forEach((ex, index) => {
                const item = document.createElement('div');
                item.className = 'flex flex-col bg-slate-900 p-3 rounded-lg border border-slate-700 text-xs space-y-2';
                item.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="font-semibold text-white text-sm">${ex.title}</span>
                            <span class="text-indigo-400 block">รูปภาพ: ${ex.images ? ex.images.length : 0} ภาพ</span>
                        </div>
                        <button onclick="playSound('click'); removeExhibit(${index})" class="text-rose-400 hover:text-rose-300 px-2 py-1 font-semibold">ลบบูธ</button>
                    </div>
                    <div class="flex items-center space-x-2 pt-1 border-t border-slate-800">
                        <label class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg cursor-pointer font-medium transition inline-flex items-center space-x-1">
                            <span>➕ เพิ่มรูปภาพเข้าบูธนี้</span>
                            <input type="file" accept="image/*" multiple onchange="addImagesToBooth(${index}, event)" class="hidden">
                        </label>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function removeExhibit(index) {
            exhibits.splice(index, 1);
            renderExhibitsInScene();
            renderExhibitsList();
        }

        window.onload = init;
    </script>
</body>
